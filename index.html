  <style>
    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #767676;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      z-index: 999;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: #fff;
    }

    .back-link svg {
      flex-shrink: 0;
    }

    .back-link .icon-2048 {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #f0b84a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.5px;
    }

    /* Focus ring */
    :focus-visible {
      outline: 2px solid #767676;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Selection colour */
    ::selection {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Cross-document View Transitions (Chrome 126+, graceful fallback) */
    @view-transition {
      navigation: auto;
    }

    ::view-transition-old(root) {
      animation: vt-out 0.18s ease-out forwards;
    }

    ::view-transition-new(root) {
      animation: vt-in 0.22s ease-out forwards;
    }

    @keyframes vt-out {
      to {
        opacity: 0;
        transform: translateY(6px) scale(0.99);
      }
    }

    @keyframes vt-in {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(1.01);
      }
    }
  </style>
</head>

<body>
  <a href="/apps/" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7" />
    </svg>
    apps.barczynski.dev
  </a>
  <div id="root" role="main"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
